apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: student-management
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: student-management-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: student-management-backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend.student-management.svc.cluster.local:5000"]
