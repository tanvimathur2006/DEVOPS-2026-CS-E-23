apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: student-management
  labels:
    app: frontend
    app.kubernetes.io/name: student-management-frontend
    app.kubernetes.io/part-of: student-management-system
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
