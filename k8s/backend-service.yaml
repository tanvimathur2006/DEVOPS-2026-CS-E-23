apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: student-management
  labels:
    app: backend
    app.kubernetes.io/name: student-management-backend
    app.kubernetes.io/part-of: student-management-system
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "5000"
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP
