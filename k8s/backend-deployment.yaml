apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: student-management
  labels:
    app.kubernetes.io/name: student-management-backend
    app.kubernetes.io/part-of: student-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: student-management-backend
        app.kubernetes.io/part-of: student-management-system
    spec:
      containers:
        - name: backend
          image: student-management-backend:security-e64ac36
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: student-management-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: student-management-secrets
                  key: MONGODB_URI
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
